<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>System</title>

<style>
*{
    box-sizing:border-box;
}

html,body{
    margin:0;
    width:100%;
    height:100%;
    overflow:hidden;
    background:#000;
    font-family:monospace;
}

body{
    color:#00ff41;
}

/* شاشة الهكر */
#hack{
    position:absolute;
    inset:0;
    padding:30px;
    background:
      radial-gradient(circle at center, #031000 0%, #000 70%);
    font-size:18px;
    line-height:1.7;
    text-shadow:0 0 8px #00ff41;
}

.line{
    opacity:0;
    animation:show .3s forwards;
}

@keyframes show{
    to{opacity:1}
}

.cursor{
    display:inline-block;
    width:10px;
    height:20px;
    background:#00ff41;
    animation:blink .5s infinite;
}

@keyframes blink{
    50%{opacity:0}
}

/* خطوط الشاشة */
.scanlines{
    position:fixed;
    inset:0;
    pointer-events:none;
    z-index:50;
    background:repeating-linear-gradient(
        to bottom,
        rgba(255,255,255,.025) 0px,
        rgba(255,255,255,.025) 1px,
        transparent 2px,
        transparent 4px
    );
}

/* فلاش */
#flash{
    position:fixed;
    inset:0;
    background:white;
    opacity:0;
    z-index:100;
    pointer-events:none;
}

.flash{
    animation:flash .35s;
}

@keyframes flash{
    0%{opacity:0}
    20%{opacity:.95}
    40%{opacity:0}
    60%{opacity:.8}
    100%{opacity:0}
}

/* الوحش */
#monster{
    position:absolute;
    inset:0;
    display:flex;
    align-items:center;
    justify-content:center;
    opacity:0;
    z-index:20;
    transform:scale(.3);
}

.monster-body{
    position:relative;
    width:330px;
    height:420px;
    background:#050505;
    border-radius:48% 48% 25% 25%;
    box-shadow:
        0 0 30px #ff0000,
        0 0 100px #550000;
}

/* القرون */
.horn{
    position:absolute;
    top:-130px;
    width:100px;
    height:170px;
    background:#050505;
    clip-path:polygon(50% 0,100% 100%,55% 75%,25% 100%);
}

.horn.left{
    left:15px;
    transform:rotate(-18deg);
}

.horn.right{
    right:15px;
    transform:scaleX(-1) rotate(-18deg);
}

/* العيون */
.eye{
    position:absolute;
    top:120px;
    width:85px;
    height:42px;
    background:#ff0000;
    box-shadow:0 0 25px red;
    border-radius:50%;
}

.eye.left{
    left:45px;
    transform:rotate(12deg);
}

.eye.right{
    right:45px;
    transform:rotate(-12deg);
}

/* البؤبؤ */
.eye:after{
    content:"";
    position:absolute;
    left:38px;
    top:4px;
    width:8px;
    height:34px;
    background:#000;
}

/* الفم */
.mouth{
    position:absolute;
    left:45px;
    right:45px;
    bottom:65px;
    height:115px;
    background:#000;
    border:4px solid #550000;
    border-radius:10px 10px 50% 50%;
    overflow:hidden;
}

/* الأسنان */
.tooth{
    position:relative;
    display:inline-block;
    width:0;
    height:0;
    border-left:10px solid transparent;
    border-right:10px solid transparent;
    border-top:30px solid #fff;
    margin:4px 3px;
}

/* ظهور الوحش */
.showMonster{
    animation:
      monsterIn .55s cubic-bezier(.1,1.5,.3,1) forwards,
      shake .08s 5;
}

@keyframes monsterIn{
    0%{
        opacity:0;
        transform:scale(.1);
    }
    55%{
        opacity:1;
        transform:scale(1.25);
    }
    100%{
        opacity:1;
        transform:scale(1);
    }
}

@keyframes shake{
    0%{transform:translate(8px,-5px) scale(1.03)}
    50%{transform:translate(-8px,5px) scale(1.03)}
    100%{transform:translate(5px,3px) scale(1.03)}
}

/* النهاية */
#ending{
    position:absolute;
    inset:0;
    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:center;
    opacity:0;
    z-index:30;
    background:
      radial-gradient(circle,#260000 0%,#080000 35%,#000 75%);
}

#ending h1{
    margin:0;
    color:#ff0000;
    font-family:Arial,sans-serif;
    font-size:clamp(45px,7vw,100px);
    text-shadow:
      0 0 8px red,
      0 0 25px red,
      0 0 50px #550000;
    animation:glitch .12s infinite;
}

#ending p{
    color:#aaa;
    font-size:20px;
    margin-top:20px;
}

.showEnding{
    animation:endIn 1s forwards;
}

@keyframes endIn{
    to{opacity:1}
}

@keyframes glitch{
    0%{transform:translate(0)}
    25%{transform:translate(3px,-2px)}
    50%{transform:translate(-3px,2px)}
    75%{transform:translate(2px,1px)}
    100%{transform:translate(0)}
}

/* زر البداية */
#start{
    position:fixed;
    inset:0;
    z-index:200;
    display:flex;
    align-items:center;
    justify-content:center;
    background:#000;
}

#start button{
    padding:18px 45px;
    background:#000;
    color:#00ff41;
    border:2px solid #00ff41;
    font-size:22px;
    font-family:monospace;
    cursor:pointer;
    box-shadow:0 0 20px #00ff41;
}

#start button:hover{
    background:#00ff41;
    color:#000;
}
</style>
</head>

<body>

<div id="start">
    <button onclick="start()">▶ تشغيل النظام</button>
</div>

<div id="hack"></div>

<div id="monster">
    <div class="monster-body">
        <div class="horn left"></div>
        <div class="horn right"></div>

        <div class="eye left"></div>
        <div class="eye right"></div>

        <div class="mouth">
            <span class="tooth"></span>
            <span class="tooth"></span>
            <span class="tooth"></span>
            <span class="tooth"></span>
            <span class="tooth"></span>
            <span class="tooth"></span>
            <span class="tooth"></span>
            <span class="tooth"></span>
            <span class="tooth"></span>
            <span class="tooth"></span>
        </div>
    </div>
</div>

<div id="ending">
    <h1>أهلاً بيكي في مملكة جلاده</h1>
    <p>...WELCOME TO THE KINGDOM</p>
</div>

<div id="flash"></div>
<div class="scanlines"></div>

<script>

function start(){

    document.getElementById("start").style.display="none";

    const hack=document.getElementById("hack");

    const lines=[
        "[ SYSTEM BOOT ]",
        "Initializing secure connection...",
        "Connecting to remote server...",
        "Connection established.",
        "",
        ">> ACCESSING SYSTEM...",
        ">> BYPASSING SECURITY...",
        ">> ████████████████████ 100%",
        "",
        "WARNING: UNAUTHORIZED ACCESS",
        "WARNING: UNKNOWN ENTITY DETECTED",
        "",
        "Scanning environment...",
        "Searching...",
        "Searching...",
        "ENTITY FOUND.",
        "",
        "!!! DO NOT CLOSE THIS WINDOW !!!"
    ];

    let i=0;

    function typeLine(){

        if(i < lines.length){

            const div=document.createElement("div");
            div.className="line";
            div.textContent=lines[i];

            if(lines[i].includes("WARNING") || lines[i].includes("ENTITY")){
                div.style.color="#ff2222";
                div.style.textShadow="0 0 10px red";
            }

            hack.appendChild(div);

            i++;
            setTimeout(typeLine,170);

        }else{

            setTimeout(jumpscare,900);

        }
    }

    typeLine();
}


function jumpscare(){

    const flash=document.getElementById("flash");
    const monster=document.getElementById("monster");
    const hack=document.getElementById("hack");

    hack.style.display="none";

    /* فلاش مفاجئ */
    flash.classList.add("flash");

    /* الوحش */
    setTimeout(()=>{
        monster.classList.add("showMonster");

        /* اهتزاز الشاشة */
        document.body.animate([
            {transform:"translate(0,0)"},
            {transform:"translate(15px,-10px)"},
            {transform:"translate(-15px,10px)"},
            {transform:"translate(10px,5px)"},
            {transform:"translate(0,0)"}
        ],{
            duration:500,
            iterations:2
        });

    },100);

    /* اختفاء الوحش */
    setTimeout(()=>{

        monster.style.opacity="0";

        setTimeout(()=>{
            document.getElementById("ending")
                .classList.add("showEnding");
        },300);

    },2600);
}

</script>

</body>
</html>
