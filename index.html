<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ZONE GALAD NONTY</title>

<style>
*{box-sizing:border-box}

body{
    margin:0;
    background:#000;
    color:#fff;
    font-family:Arial,sans-serif;
    overflow:hidden;
}

/* شاشة البداية */
.start{
    position:fixed;
    inset:0;
    background:#050505;
    display:flex;
    align-items:center;
    justify-content:center;
    z-index:20;
}

.start button{
    background:#111;
    border:2px solid #ff2020;
    color:#ff2020;
    padding:20px 45px;
    font-size:25px;
    font-weight:bold;
    border-radius:8px;
    cursor:pointer;
    box-shadow:0 0 25px #900;
    animation:pulse 1.2s infinite;
}

@keyframes pulse{
    50%{box-shadow:0 0 50px red}
}

/* شكل الفيديو */
.video{
    position:fixed;
    inset:0;
    background:
      radial-gradient(circle at center,#190000 0%,#050000 35%,#000 75%);
    display:none;
    overflow:hidden;
}

.top{
    position:absolute;
    top:18px;
    left:20px;
    right:20px;
    display:flex;
    justify-content:space-between;
    color:#aaa;
    font-size:13px;
    z-index:5;
}

.code{
    position:absolute;
    inset:0;
    padding:20px;
    color:#0f3;
    opacity:.22;
    font-family:monospace;
    font-size:13px;
    line-height:20px;
    animation:scroll 12s linear infinite;
}

@keyframes scroll{
    from{transform:translateY(0)}
    to{transform:translateY(-300px)}
}

.warning{
    position:absolute;
    top:30%;
    width:100%;
    text-align:center;
    color:#ff1111;
    font-family:monospace;
    font-size:18px;
    text-shadow:0 0 12px red;
}

.title{
    position:absolute;
    top:43%;
    width:100%;
    text-align:center;
    color:#ff0000;
    font-size:clamp(38px,8vw,100px);
    font-weight:900;
    text-shadow:
      0 0 5px red,
      0 0 20px red,
      0 0 50px #700;
    animation:glitch .7s infinite;
    z-index:4;
}

@keyframes glitch{
    0%,100%{transform:translateX(0)}
    20%{transform:translateX(5px)}
    21%{transform:translateX(-6px)}
    50%{transform:skewX(3deg)}
    51%{transform:skewX(-3deg)}
}

.sub{
    position:absolute;
    top:57%;
    width:100%;
    text-align:center;
    color:#aaa;
    font-family:monospace;
    font-size:15px;
    z-index:4;
}

.blood{
    position:absolute;
    top:56%;
    left:10%;
    right:10%;
    height:200px;
    z-index:3;
}

.drop{
    position:absolute;
    top:0;
    width:8px;
    height:var(--h);
    background:#a00000;
    border-radius:0 0 10px 10px;
    box-shadow:0 0 10px red;
    animation:drip var(--speed) infinite;
}

@keyframes drip{
    0%{transform:scaleY(.1);transform-origin:top}
    60%{transform:scaleY(1)}
    100%{transform:translateY(100px);opacity:0}
}

.bottom{
    position:absolute;
    bottom:25px;
    width:100%;
    text-align:center;
    color:#555;
    font-family:monospace;
    font-size:12px;
}

.flash{
    position:absolute;
    inset:0;
    background:red;
    opacity:0;
    z-index:10;
    pointer-events:none;
    animation:flash 3s infinite;
}

@keyframes flash{
    0%,92%,100%{opacity:0}
    94%{opacity:.12}
    96%{opacity:0}
}
</style>
</head>

<body>

<div class="start" id="start">
    <button onclick="startVideo()">▶ تشغيل الفيديو</button>
</div>

<div class="video" id="video">

    <div class="top">
        <span>ZONE GALAD NONTY</span>
        <span>● LIVE SIGNAL</span>
    </div>

    <div class="code" id="code"></div>

    <div class="warning">
        SYSTEM WARNING<br>
        UNKNOWN SIGNAL DETECTED<br>
        CONNECTION ESTABLISHED
    </div>

    <div class="title">مرحبًا بك في الموت</div>

    <div class="sub">
        ACCESSING UNKNOWN NODE...<br>
        <span id="status">INITIALIZING...</span>
    </div>

    <div class="blood">
        <span class="drop" style="left:5%;--h:100px;--speed:2.2s"></span>
        <span class="drop" style="left:16%;--h:150px;--speed:3s"></span>
        <span class="drop" style="left:29%;--h:80px;--speed:2.5s"></span>
        <span class="drop" style="left:42%;--h:130px;--speed:3.4s"></span>
        <span class="drop" style="left:55%;--h:90px;--speed:2.8s"></span>
        <span class="drop" style="left:68%;--h:160px;--speed:3.2s"></span>
        <span class="drop" style="left:80%;--h:110px;--speed:2.4s"></span>
        <span class="drop" style="left:93%;--h:140px;--speed:3.6s"></span>
    </div>

    <div class="bottom">
        CONNECTION: ENCRYPTED |
        NODE: 13-X |
        STATUS: UNKNOWN
    </div>

    <div class="flash"></div>
</div>

<script>
function startVideo(){

    document.getElementById("start").style.display="none";
    document.getElementById("video").style.display="block";

    const code=document.getElementById("code");

    let text="";

    const chars="01ABCDEFGHIJKLMNOPQRSTUVWXYZ#$%&@";

    for(let i=0;i<12000;i++){
        text+=chars[Math.floor(Math.random()*chars.length)];

        if(i%80===0) text+="<br>";
    }

    code.innerHTML=text;

    const statuses=[
        "SCANNING...",
        "ACCESS GRANTED",
        "TRACE FOUND",
        "TRACE LOST",
        "SYSTEM ERROR",
        "RECONNECTING...",
        "SIGNAL UNSTABLE",
        "UNKNOWN USER",
        "FINAL PROTOCOL ACTIVE"
    ];

    let i=0;

    setInterval(()=>{
        document.getElementById("status").textContent=statuses[i];
        i=(i+1)%statuses.length;
    },900);
}
</script>

</body>
</html>
